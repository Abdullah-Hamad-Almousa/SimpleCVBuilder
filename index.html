<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main menu</title>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: radial-gradient(circle at top right, #1a1a1a, #000);
      font-family: 'Outfit', sans-serif;
      color: #fff;
      overflow-x: hidden;
    }

    .main-content {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 2rem;
      animation: fadeIn 1s ease-out;
    }

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: translateY(20px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .hero-title {
      font-size: 3.5rem;
      font-weight: 700;
      margin-bottom: 2.5rem;
      text-align: center;
      background: linear-gradient(45deg, #1a73e8, #ff4757);
      -webkit-background-clip: text;
      background-clip: text;
      -webkit-text-fill-color: transparent;
      letter-spacing: -2px;
      text-transform: uppercase;
    }

    .button-container {
      display: flex;
      gap: 24px;
      background: rgba(26, 115, 232, 0.08);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 3.5rem;
      border-radius: 32px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
    }

    .btn {
      padding: 18px 45px;
      font-size: 18px;
      font-weight: 700;
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      background-color: #ff4757;
      color: white;
      cursor: pointer;
      transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      box-shadow: 0 10px 20px rgba(255, 71, 87, 0.2);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    .btn:hover {
      transform: translateY(-8px) scale(1.03);
      box-shadow: 0 20px 40px rgba(255, 71, 87, 0.4);
      filter: brightness(1.2);
      border-color: rgba(255, 255, 255, 0.4);
    }

    header.header,
    .footer {
      width: 100%;
      background: rgba(0, 0, 0, 0.3);
      backdrop-filter: blur(10px);
      color: #888;
      text-align: center;
      padding: 1.5rem;
      font-size: 13px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      letter-spacing: 1px;
    }

    .footer {
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: none;
      margin-top: auto;
    }
  </style>
</head>

<body>
  <header class="header">
    <div>
      <img src="./assets/MM-BXzI00lk.png" alt="Logo"
        style="cursor:pointer; height: 30px; vertical-align: middle; object-fit: cover; border-radius: 12px;"
        onclick="window.location.href='https://my-resume-kappa-one.vercel.app/'" />
    </div>
  </header>
  <div class="main-content">
    <h1 class="hero-title">CV MASTER AI</h1>
    <div class="button-container">
      <button class="btn" onclick="window.location.href='pages/engCvCreator.html'">
        English Builder
      </button>
      <button class="btn" onclick="window.location.href='pages/arCvCreator.html'">
        المنشئ العربي
      </button>
      <button class="btn" style="opacity: 0.5; cursor: not-allowed;" disabled>
        Coming Soon
      </button>
    </div>
  </div>
  <footer class="footer">
    <p>
      &copy; 2026 Abdullah Hamad Mohammad Almousa. All rights reserved.
    </p>
  </footer>
</body>

</html>
