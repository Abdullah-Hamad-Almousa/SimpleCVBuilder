<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Generator - Pro Advanced</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 1000px;
            margin: 2rem auto;
            padding: 0 1rem;
            line-height: 1.5;
            background-color: #f0f2f5;
            color: #333;
        }

        h1 {
            border-bottom: 3px solid #007bff;
            padding-bottom: 0.5rem;
            color: #007bff;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .config-section {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            margin-bottom: 2rem;
            border-top: 5px solid #007bff;
        }

        .config-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            border-bottom: 1px solid #eee;
            padding-bottom: 0.5rem;
        }

        .config-header h3 {
            margin: 0;
            color: #444;
        }

        .form-group {
            margin-bottom: 1.2rem;
        }

        label {
            display: block;
            font-weight: 600;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
            color: #555;
        }

        input,
        select {
            width: 100%;
            padding: 0.7rem;
            border: 1px solid #ddd;
            border-radius: 6px;
            box-sizing: border-box;
        }

        .dynamic-item {
            background: #f8f9fa;
            padding: 1rem;
            border-radius: 8px;
            border: 1px solid #e9ecef;
            position: relative;
            margin-bottom: 1rem;
        }

        #sectionsContainer,
        #listSectionsContainer {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .main-field,
        .list-field-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            position: relative;
            border-top: 5px solid #28a745;
        }

        .list-field-card {
            border-top-color: #9b59b6;
        }

        .tag-field-card {
            background: white;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            position: relative;
            border-top: 5px solid #e67e22;
            border-left: 5px solid black;
            margin-bottom: 2rem;
        }

        .flex-row {
            display: flex;
            gap: 0.5rem;
        }

        .remove-btn {
            position: absolute;
            top: 10px;
            right: 10px;
            background: #ff4757;
            color: white;
            border: none;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10;
            font-weight: bold;
        }

        .toggle-btn {
            background-color: #6c757d;
            color: white;
            border: none;
            padding: 0 12px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 0.8rem;
            font-weight: bold;
        }

        .toggle-btn.active {
            background-color: #007bff;
        }

        .controls {
            display: flex;
            gap: 1rem;
            margin-bottom: 2rem;
            position: sticky;
            bottom: 1rem;
            z-index: 100;
        }

        .btn-action {
            flex: 1;
            padding: 1.2rem;
            cursor: pointer;
            border-radius: 10px;
            font-weight: 700;
            border: none;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        .add-btn {
            background-color: #28a745;
            color: white;
        }

        .list-btn {
            background-color: #9b59b6;
            color: white;
        }

        .generate-btn {
            background-color: #007bff;
            color: white;
        }

        .pdf-btn {
            background-color: #e74c3c;
            color: white;
            margin-top: 1rem;
            width: 100%;
        }

        .color-pickers {
            display: flex;
            gap: 2rem;
            background: #fff;
            padding: 1rem 1.5rem;
            border-radius: 12px;
            margin-bottom: 2rem;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.05);
            align-items: center;
        }

        input[type="color"] {
            width: 40px;
            height: 40px;
            border: none;
            padding: 0;
            background: none;
        }

        textarea {
            width: 100%;
            height: 400px;
            font-family: monospace;
            padding: 1.5rem;
            border: 2px solid #ddd;
            border-radius: 12px;
            background: #2d3436;
            color: #dfe6e9;
        }
    </style>
</head>

<body>

    <div
        style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 3px solid #000; padding-bottom: 1rem;">
        <h1 style="border:none; padding:0; margin:0; color:#000;">CV Pro Advanced Generator</h1>
        <div style="display: flex; gap: 1rem; align-items: center;">
            <button class="toggle-btn active" onclick="window.location.href='../index.html'"
                style="background-color: #333;">
                Go Back
            </button>
            <img src="Images/MM.png" alt="Logo"
                style="cursor:pointer; height: 40px; vertical-align: middle; object-fit: cover; border-radius: 8px;"
                onclick="window.location.href='https://my-resume-kappa-one.vercel.app/'" />
        </div>
    </div>



    <div class="config-section">
        <div class="config-header">
            <h3>Header Section</h3>
            <button class="toggle-btn active" id="addHeaderBtn" onclick="addHeaderItem()">+ Add Items max is 8</button>
        </div>
        <div class="form-group">
            <label>Header Text:</label>
            <input type="text" id="headerHugeText" placeholder="(Your Name Here)">
        </div>
        <div id="headerItemsContainer" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;"></div>
    </div>

    <div id="sectionsContainer"></div>
    <div id="listSectionsContainer"></div>

    <div class="tag-field-card">
        <div class="config-header">
            <h3>Tag Section:</h3>
            <button class="toggle-btn active" onclick="addTagCategory()" style="background:#e67e22;">+ Add Tag
                Category</button>
        </div>
        <div class="form-group">
            <label>Tag Group Title:</label>
            <input type="text" id="tagSectionHeader" placeholder="This is the name of the whole tag section.">
        </div>
        <div id="tagCategoriesContainer"></div>
    </div>

    <div class="controls">
        <button class="btn-action add-btn" onclick="addBodySection()">+ Add Main Section</button>
        <button class="btn-action list-btn" onclick="addListSection()">+ Add List Section</button>
        <button class="btn-action generate-btn" onclick="generateCode()">Generate Final HTML Code</button>
    </div>

    <div class="output-box">
        <h3>Generated Source Code:</h3>
        <textarea id="outputCode" readonly></textarea>
        <button class="btn-action pdf-btn" id="printPdfBtn" onclick="printAsPDF()">Print as PDF (Microsoft Print to
            PDF)</button>
    </div>

    <footer>
        <p>&copy; 2026 Abdullah Hamad Mohammad Almousa. All rights reserved.</p>
    </footer>

    <script>
        let bodySectionCount = 0; let headerItemCount = 0; let tagCategoryCount = 0; let listSectionCount = 0;

        function addHeaderItem() {
            if (headerItemCount >= 8) return; headerItemCount++;
            const container = document.getElementById('headerItemsContainer');
            const itemDiv = document.createElement('div');
            itemDiv.className = 'dynamic-item'; itemDiv.id = `h_item_${headerItemCount}`;
            itemDiv.innerHTML = `
                <button class="remove-btn" onclick="removeElement('h_item_${headerItemCount}'); headerItemCount--; updateHeaderBtn();">×</button>
                <select class="h-type" style="margin:0.5rem 0; width: 100%;">
                    <option value="" disabled selected>Select a type</option>
                    <option value="Phone">Phone</option>
                    <option value="Email">Email</option>
                    <option value="LinkedIn">LinkedIn</option>
                    <option value="GitHub">GitHub</option>
                    <option value="Kaggle">Kaggle</option>
                    <option value="Portfolio">Portfolio</option>
                    <option value="Website">Website</option>
                    <option value="Location">Location</option>
                </select>
                <input type="text" class="h-value" placeholder="Value (e.g. +966..., username)">
            `;
            container.appendChild(itemDiv); updateHeaderBtn();
        }

        function updateHeaderBtn() { const btn = document.getElementById('addHeaderBtn'); btn.disabled = headerItemCount >= 8; btn.style.opacity = headerItemCount >= 8 ? "0.5" : "1"; }

        function addBodySection() {
            bodySectionCount++;
            const container = document.getElementById('sectionsContainer');
            const sectionDiv = document.createElement('div'); sectionDiv.className = 'main-field'; sectionDiv.id = `body_sec_${bodySectionCount}`;
            sectionDiv.innerHTML = `
                <button class="remove-btn" onclick="removeElement('body_sec_${bodySectionCount}')">×</button>
                <h3>Main Section</h3>
                <div class="form-group"><label>Section title:</label>
                    <div class="flex-row"><input type="text" class="field-top" placeholder="Title (e.g. Professional Experience)"></div>
                </div>
                <div class="form-group"><label>Description & Note (Italic/Opposite):</label>
                    <div class="flex-row"><input type="text" class="field-mid" placeholder="Content text"><input type="text" class="field-info" placeholder="Info Note"></div>
                </div>
                <div class="form-group"><label>Bullet Points</label>
                    <div id="small_items_${bodySectionCount}"></div>
                    <button class="toggle-btn active" onclick="addSmallItem('small_items_${bodySectionCount}')" style="background:#28a745; margin-top:0.5rem;">+ Add Item</button>
                </div>
            `;
            container.appendChild(sectionDiv);
        }

        function addListSection() {
            listSectionCount++;
            const container = document.getElementById('listSectionsContainer');
            const div = document.createElement('div'); div.className = 'list-field-card'; div.id = `list_sec_${listSectionCount}`;
            div.innerHTML = `
                <button class="remove-btn" onclick="removeElement('list_sec_${listSectionCount}')">×</button>
                <h3>List Section</h3>
                <div class="form-group"><label>Section Title:</label><input type="text" class="l-huge" placeholder="This is the main heading for the list section"></div>
                <div class="form-group"><label>Medium Header & Info:</label><div class="flex-row"><input type="text" class="l-med" placeholder="Description"><input type="text" class="l-info" placeholder="Write additional details here.."></div></div>
                <div id="list_items_${listSectionCount}"></div>
                <button class="toggle-btn active" onclick="addListItem('list_items_${listSectionCount}')" style="background:#9b59b6;">+ Add List Item</button>
            `;
            container.appendChild(div);
        }

        function addListItem(targetId) {
            const list = document.getElementById(targetId); const rowId = Date.now();
            const group = document.createElement('div'); group.className = 'dynamic-item'; group.id = `li_${rowId}`;
            group.innerHTML = `
                <button class="remove-btn" onclick="removeElement('li_${rowId}')">×</button>
                <div class="flex-row"><input type="text" class="li-bold" placeholder="Bold (name of certification)"> <input type="text" class="li-norm" placeholder="(e.g. Detail)"></div>
            `;
            list.appendChild(group);
        }

        function addTagCategory() {
            tagCategoryCount++;
            const container = document.getElementById('tagCategoriesContainer');
            const catDiv = document.createElement('div'); catDiv.className = 'dynamic-item'; catDiv.id = `tag_cat_${tagCategoryCount}`;
            catDiv.innerHTML = `
                <button class="remove-btn" onclick="removeElement('tag_cat_${tagCategoryCount}')">×</button>
                <div class="form-group"><label>Category Name:</label><input type="text" class="cat-name" placeholder="Label for a group of related tags."></div>
                <div class="tag-row" id="tag_list_${tagCategoryCount}"></div>
                <button class="toggle-btn active" onclick="addTagToCat('tag_list_${tagCategoryCount}')" style="background:#e67e22; margin-top:0.5rem;">+ Add Tag</button>
            `;
            container.appendChild(catDiv);
        }

        function addTagToCat(listId) {
            const list = document.getElementById(listId); const tagId = Date.now();
            const group = document.createElement('div'); group.className = 'flex-row'; group.id = `tag_${tagId}`; group.style.marginBottom = "5px";
            group.innerHTML = `<input type="text" class="tag-val" style="padding:0.4rem;" placeholder="Add your tage (Skill)"><button class="toggle-btn active" style="background:#ff4757;" onclick="removeElement('tag_${tagId}')">×</button>`;
            list.appendChild(group);
        }

        function addSmallItem(containerId) {
            const container = document.getElementById(containerId); const itemId = Date.now();
            const group = document.createElement('div'); group.className = 'flex-row'; group.id = `small_${itemId}`; group.style.marginBottom = "5px";
            group.innerHTML = `<input type="text" class="field-down" style="padding:0.4rem;" placeholder="Small note text..."><button class="toggle-btn active" style="background:#ff4757;" onclick="removeElement('small_${itemId}')">×</button>`;
            container.appendChild(group);
        }

        function toggleSize(btn) {
            const hiddenInput = btn.nextElementSibling;
            if (btn.textContent === 'Large') { btn.textContent = 'Medium'; btn.classList.remove('active'); hiddenInput.value = 'medium'; }
            else { btn.textContent = 'Large'; btn.classList.add('active'); hiddenInput.value = 'large'; }
        }

        function removeElement(id) { document.getElementById(id).remove(); }

        function generateCode() {
            const primary = "#000000";
            const secondary = "#000000";
            const hugeText = document.getElementById('headerHugeText').value;

            let headerItemsHtml = '';
            document.querySelectorAll('.dynamic-item:has(.h-value)').forEach((item) => {
                const type = item.querySelector('.h-type').value;
                const val = item.querySelector('.h-value').value;

                let labelHtml = type ? `<span class="contact-label">${type}:</span>` : '';

                let valueHtml = val;

                headerItemsHtml += `
                <li class="contact-item">
                    ${labelHtml}
                    <span class="contact-value">${valueHtml}</span>
                </li>`;
            });

            let sectionsHtml = '';
            document.querySelectorAll('.main-field').forEach(sec => {
                const top = sec.querySelector('.field-top').value;
                const mid = sec.querySelector('.field-mid').value;
                const info = sec.querySelector('.field-info').value;

                let smallItemsHtml = '';
                sec.querySelectorAll('.field-down').forEach(item => {
                    if (item.value.trim()) {
                        smallItemsHtml += `<li>${item.value}</li>`;
                    }
                });

                sectionsHtml += `
                <section class="section-box">
                    <h2 class="section-title">${top}</h2>
                    <div class="job-article">
                        <div class="job-header">
                            <h3 class="job-title">${mid}</h3> 
                            <div class="job-date-loc">${info}</div>
                        </div>
                        ${smallItemsHtml ? `<ul>${smallItemsHtml}</ul>` : ''}
                    </div>
                </section><hr class="section-separator">`;
            });

            let listSectionsHtml = '';
            document.querySelectorAll('.list-field-card').forEach(sec => {
                const huge = sec.querySelector('.l-huge').value;
                const med = sec.querySelector('.l-med').value;
                const info = sec.querySelector('.l-info').value;

                let itemsHtml = '';
                sec.querySelectorAll('.dynamic-item').forEach(item => {

                    itemsHtml += `<li><strong>${item.querySelector('.li-bold').value}</strong> ${item.querySelector('.li-norm').value}</li>`;
                });

                let medHtml = med ? `<p><strong>${med}</strong> ${info}</p>` : '';

                listSectionsHtml += `
                <section class="section-box list-section">
                    <h2 class="section-title">${huge}</h2>
                    ${medHtml}
                    <ul>${itemsHtml}</ul>
                </section><hr class="section-separator">`;
            });

            const tagTitle = document.getElementById('tagSectionHeader').value;
            let tagsInnerHtml = '';
            document.querySelectorAll('#tagCategoriesContainer .dynamic-item').forEach(cat => {
                const name = cat.querySelector('.cat-name').value;
                let innerTags = [];
                cat.querySelectorAll('.tag-val').forEach(t => { innerTags.push(t.value); });

                if (innerTags.length > 0) {
                    tagsInnerHtml += `<div class="skills-row"><span class="skill-category">${name}:</span> ${innerTags.join(', ')}</div>`;
                }
            });

            let tagsSectionHtml = (tagTitle || tagsInnerHtml) ? `
            <section class="section-box skills-section">
                <h2 class="section-title">${tagTitle}</h2>
                ${tagsInnerHtml}
            </section><hr class="section-separator">` : '';

            const htmlContent = `<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>${hugeText || 'CV'}</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');
        :root { --primary-color: ${primary}; --secondary-color: ${secondary}; --text-color: #333; }
        body { 
            font-family: 'Roboto', sans-serif; 
            margin: 0; 
            padding: 40px; 
            color: var(--text-color); 
            background: white; 
            line-height: 1.5;
            max-width: 800px;
            margin: 0 auto;
        }
        header { margin-bottom: 25px; }
        h1 { 
            font-size: 32px; 
            font-weight: 700; 
            color: #000; 
            margin: 0 0 10px 0; 
            text-transform: capitalize;
        }
        address { 
            font-size: 14px; 
            line-height: 1.6;
            font-style: normal;
        }
        ul.contact-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        li.contact-item { display: flex; align-items: baseline; margin-bottom: 2px; }
        .contact-label { 
            font-weight: 700; 
            width: 80px; /* Fixed width for labels */
            flex-shrink: 0;
            color: #000;
        }
        .contact-value { color: #333; }
        
        section { margin-bottom: 15px; }

        h2.section-title { 
            font-size: 18px; 
            font-weight: 700; 
            color: #000; 
            border-bottom: 1px solid #ddd; 
            padding-bottom: 5px; 
            margin: 25px 0 15px 0; 
        }

        .job-article { margin-bottom: 20px; }
        .job-header { 
            display: flex; 
            justify-content: space-between; 
            align-items: baseline; 
            margin-bottom: 5px;
        }
        .job-title { margin: 0; font-weight: 700; font-size: 16px; color: #000; }
        .job-date-loc { font-style: italic; color: #555; font-size: 14px; }
        
        ul { margin: 5px 0; padding-left: 20px; }
        li { margin-bottom: 3px; font-size: 14px; }

        .skills-section ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .skills-row { margin-bottom: 5px; }
        .skill-category { font-weight: 700; display: inline; }
        
        .section-separator { border: 0; border-bottom: 1px solid #ddd; margin: 30px 0; }
        main > .section-separator:last-child { display: none; }

        @media print {
            @page { margin: 0; }
            body { padding: 0; margin: 1.6cm; }
        }
    </style>
</head>
<body>
    <header>
        <h1>${hugeText}</h1>
        <address>
            <ul class="contact-list">
                ${headerItemsHtml}
            </ul>
        </address>
    </header>

    <main>
        ${sectionsHtml}
        ${listSectionsHtml}
        ${tagsSectionHtml}
    </main>
</body>
</html>`;
            document.getElementById('outputCode').value = htmlContent;
        }

        function printAsPDF() {
            const code = document.getElementById('outputCode').value;
            if (!code) {
                alert("Please generate the code first!");
                return;
            }
            const printWindow = window.open('', '_blank');
            printWindow.document.write(code);
            printWindow.document.close();
            printWindow.focus();
            setTimeout(() => {
                printWindow.print();

            }, 500);
        }

        addHeaderItem(); addHeaderItem(); addBodySection(); addListSection(); addTagCategory();
    </script>
</body>

</html>
