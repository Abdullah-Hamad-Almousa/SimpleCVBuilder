          rolePlaceholder: 'الدور',
          datePlaceholder: 'التاريخ',
          addDesc: 'إضافة وصف'
        },
        skills: {
          categoryLabel: 'اسم الفئة:',
          categoryPlaceholder: 'تقني/اهتمامات',
          addItem: 'إضافة بند',

          removeDesc: 'إزالة صف الوصف',
          removeSkillCategory: 'إزالة فئة المهارات',

  <script src="js/html-docx.js"></script>
  <script src="js/FileSaver.min.js"></script>
  <script src="js/html2pdf.bundle.min.js"></script>
  <script type="module" crossorigin src="../assets/builder-9dK6Vlwy.js"></script>
  <link rel="stylesheet" crossorigin href="../assets/builder-8RNFfinm.css">
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem; border-bottom: 3px solid rgba(255,255,255,0.1); padding-bottom: 1rem;">
    <h1 style="border:none; padding:0; margin:0;">مولد السيرة الذاتية المتطور</h1>
    <div style="display: flex; gap: 1rem; align-items: center;">
      <button class="toggle-btn active" onclick="window.location.href='../index.html'" style="background-color: #ff4757;">العودة</button>
      <img src="../assets/MM-BXzI00lk.png" alt="Logo" style="cursor:pointer; height: 40px; border-radius: 8px;" onclick="window.location.href='https://abdullah-hamad-almousa.github.io/MyNewPortfolio/pages/Linkes/Links.html'" />
    </div>
  </div>

  <div class="builder-layout">
    <!-- Wizard Panel -->
    <div class="wizard-panel">
      <!-- Stepper -->
      <div class="stepper">
        <div class="step"><div class="step-circle">1</div><div class="step-label">البيانات</div></div>
        <div class="step"><div class="step-circle">2</div><div class="step-label">الملخص</div></div>
        <div class="step"><div class="step-circle">3</div><div class="step-label">الخبرة</div></div>
        <div class="step"><div class="step-circle">4</div><div class="step-label">التعليم</div></div>
        <div class="step"><div class="step-circle">5</div><div class="step-label">المهارات</div></div>
        <div class="step"><div class="step-circle">6</div><div class="step-label">معاينة</div></div>
      </div>

      <!-- Step 1: Personal Info -->
      <div class="wizard-step active">
        <div class="config-section">
          <div class="config-header">
            <h3>الاسم وبيانات الاتصال</h3>
            <button class="toggle-btn active" id="addHeaderBtn" onclick="addHeaderItem()">+ إضافة بند اتصال</button>
          </div>
          <div class="form-group">
            <label>الاسم الكامل:</label>
            <input type="text" id="headerHugeText" placeholder="الاسم هنا">
          </div>
          <div id="headerItemsContainer" style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem;"></div>
        </div>
      </div>

      <!-- Step 2: Professional Summary -->
      <div class="wizard-step">
        <div class="config-section">
          <div class="config-header">
            <h3>الملخص المهني</h3>
          </div>
          <div class="form-group">
            <label>الملخص:</label>
            <div class="rich-editor-toolbar">
              <button onclick="formatText('bold')" title="عريض"><b>B</b></button>
              <button onclick="formatText('italic')" title="مائل"><i>I</i></button>
              <button onclick="formatText('underline')" title="تسطير"><u>U</u></button>
              <span class="toolbar-separator"></span>
              <div class="color-swatch" style="background:#000000" onclick="setTextColor('#000000')" title="أسود"></div>
              <div class="color-swatch" style="background:#1a73e8" onclick="setTextColor('#1a73e8')" title="أزرق"></div>
              <div class="color-swatch" style="background:#ff4757" onclick="setTextColor('#ff4757')" title="أحمر"></div>
              <div class="color-swatch" style="background:#2ed573" onclick="setTextColor('#2ed573')" title="أخضر"></div>
              <div class="color-swatch" style="background:#e67e22" onclick="setTextColor('#e67e22')" title="برتقالي"></div>
              <div class="color-swatch" style="background:#9b59b6" onclick="setTextColor('#9b59b6')" title="بنفسجي"></div>
              <div class="color-swatch" style="background:#34495e" onclick="setTextColor('#34495e')" title="رمادي غامق"></div>
              <div class="color-swatch" style="background:#7f8c8d" onclick="setTextColor('#7f8c8d')" title="رمادي"></div>
            </div>
            <div id="summaryEditor" class="rich-editor" contenteditable="true" data-placeholder="اكتب ملخصاً مهنياً موجزاً..."></div>
          </div>
        </div>
      </div>

      <!-- Step 3: Experience -->
      <div class="wizard-step">
        <div class="config-section">
          <div class="config-header">
            <h3>الخبرة العملية</h3>
            <button class="toggle-btn active" onclick="addListSection()">+ إضافة خبرة</button>
          </div>
          <div id="listSectionsContainer"></div>
        </div>
      </div>

      <!-- Step 4: Education -->
      <div class="wizard-step">
        <div class="config-section">
          <div class="config-header">
            <h3>التعليم</h3>
            <button class="toggle-btn active" onclick="addBodySection()">+ إضافة تعليم</button>
          </div>
          <div id="sectionsContainer"></div>
        </div>
      </div>

      <!-- Step 5: Skills & Activities -->
      <div class="wizard-step">
        <div class="config-section">
          <div class="config-header">
            <h3>المهارات والاهتمامات</h3>
            <button class="toggle-btn active" onclick="addSkillCategory()">+ إضافة فئة</button>
          </div>
          <div class="form-group">
            <label>عنوان القسم:</label>
            <input type="text" id="skillsSectionHeader" placeholder="المهارات والاهتمامات">
          </div>
          <div id="skillsCategoriesContainer"></div>
        </div>
        <div class="config-section">
          <div class="config-header">
            <h3>القيادة والأنشطة</h3>
            <button class="toggle-btn active" onclick="addLeadershipSection()">+ إضافة قيادة</button>
          </div>
          <div id="leadershipSectionsContainer"></div>
        </div>
      </div>

      <!-- Step 6: Preview & Download -->
      <div class="wizard-step">
        <div class="config-section">
          <div class="config-header">
            <h3>معاينة وتحميل</h3>
          </div>
          <p style="color: rgba(255,255,255,0.7); margin-bottom: 1rem;">السيرة الذاتية تظهر مباشرة في لوحة المعاينة. استخدم الأزرار أدناه للتحميل أو الطباعة.</p>
          <div class="preview-actions">
            <button class="btn-action" style="background:#3498db; color:white; width:100%; padding:1.2rem;" onclick="downloadPDF()">تحميل PDF</button>
            <button class="btn-action" style="background:#e74c3c; color:white; width:100%; padding:1.2rem;" onclick="printAsPDF()">طباعة المتصفح</button>
            <button class="btn-action" style="background:#2ecc71; color:white; width:100%; padding:1.2rem;" onclick="printAsDocx()">طباعة كـ DOCX</button>
            <button class="btn-action" style="background:#e74c3c; color:white; width:100%; padding:1.2rem;" onclick="clearAllData()">مسح الكل والبدء من جديد</button>
          </div>
        </div>
      </div>

      <!-- Wizard Navigation -->
      <div class="wizard-nav">
        <button class="wizard-btn wizard-btn-prev" id="wizardPrev" onclick="prevStep()">السابق</button>
        <button class="wizard-btn wizard-btn-next" id="wizardNext" onclick="nextStep()">التالي</button>
      </div>
    </div>

    <!-- Preview Panel -->
    <div class="preview-panel">
      <iframe id="previewFrame"></iframe>
    </div>
  </div>

  <!-- Hidden output textarea for download functions -->
  <textarea id="outputCode" readonly class="hidden-output"></textarea>
</body>
</html>
